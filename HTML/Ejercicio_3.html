<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="Crear un formulario" content="Formulario">
    <meta name="Javi" content="Javi">
    <title>Crear un formulario</title>
</head>
<body>
 
    <h1>Creacion de un formulario</h1>
    <br><br>

    <form action="#" method="post">

        <legend ><b>Formulario de contacto:</b></legend>
        <br>

            <label for="nombre apellidos">Nombre y apellidos:</label>
                <input type="text" id="nombre apellidos" name="nombre apellidos" required>
                <br></br>

            <label for="correo electrónico">Correo electrónico:</label>
                <input type="email" id="correo electrónico" name="correo electrónico" required>
                <br></br>

            <label for="Teléfono">Teléfono:</label>
                <input type="tel" id="teléfono" name="teléfono" required>
                <br></br>

            <label for="Fecha de nacimiento">Fecha de nacimiento:</label>
                <input type="date" id="Fecha de nacimiento" name="Fecha de nacimiento" required>
                <br></br>

        <legend><b>Género:</b></legend>

            <input type="radio" id="hombre" name="genero" value="hombre" required>
                <label for="hombre">Hombre</label>

            <input type="radio" id="mujer" name="genero" value="mujer" required>
                <label for="mujer">Mujer</label>

            <input type="radio" id="otro" name="genero" value="otro" required>
                <label for="otro">Otro</label>
                <br></br>

        <fieldset>

            <legend><b>Información de contacto:</b></legend>
        
                <label for="usuario">Nombre de usuario:</label>
                    <input type="text" id="usuario" name="usuario" required>
                    <br></br>

                <label for="contraseña">Contraseña:</label>
                    <input type="password" id="contraseña" name="contraseña" required>
                    <br></br>

                <label for="confirmar contraseña">Confirmar contraseña:</label>
                    <input type="password" id="confirmar contraseña" name="confirmar contraseña" required>
                    <br></br>

        </fieldset>

        <fieldset>

            <legend><b>Preferencias:</b></legend>

            <label for="color">Color favorito:</label>
                <select id="color" name="color" required>
                    <option>Seleccione un color</option>
                    <option value="rojo">Rojo</option>
                    <option value="azul">Azul</option>
                    <option value="verde">Verde</option>
                    <option value="amarillo">Amarillo</option>
                </select>
                <br></br>

                <input type="checkbox" id="terminos" name="terminos" required>
                    <label for="terminos">Aceptar los términos y condiciones</label>
                    <br></br>

        </fieldset>
        <br>
        <input type="submit" value="Registro"> 
    </form>
</body>
</html>
